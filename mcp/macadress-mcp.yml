tools_source: https://macadress.com/mcp
tools_schema_status: auth-gated
tools:
- name: lookup_mac
  description: >
    Look up a single MAC address or OUI: vendor, IEEE assignment type, block range,
    address capacity, country, transmission/administration type, randomization
    indicators, derived EUI-64/IPv6 link-local, and everything else the REST API returns.
  quota: 1 lookup per call
  input_schema: unknown (auth-gated tools/list)
- name: batch_lookup_mac
  description: Same as lookup_mac, for up to 100 addresses in one call.
  quota: per address resolved
  input_schema: unknown (auth-gated tools/list)
- name: search_vendors
  description: >
    Search the registered vendor/block directory by organization name substring and/or
    ISO 3166-1 alpha-2 country code.
  quota: 1 lookup per call
  input_schema: unknown (auth-gated tools/list)
- name: get_vendor_block
  description: >
    Full detail on one registered block by its ID, including other blocks registered to
    the same organization.
  quota: 1 lookup per call
  input_schema: unknown (auth-gated tools/list)
quota_and_limits:
  note: >
    Enforced against the same per-plan numbers as the REST API. Each surface runs as its
    own process and converges its usage count independently rather than sharing one live
    counter. There is no free/unbilled tool the way GET /v1/healthz is free on REST.
  reference: rate-limits/macadress-rate-limits.yml

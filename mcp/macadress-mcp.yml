method: searched
source: https://macadress.com/mcp
name: macadress.com MCP server
description: >
  The same MAC/OUI vendor lookup the REST API serves, exposed as Model Context Protocol
  tools. Hosted by the provider, Streamable HTTP transport, stateless (no session to
  manage), authenticated with the same API key as the REST API.
deployment:
  mode: remote
  endpoint: https://mcp.macadress.com/mcp
  install: ''
  package: ''
  auth: api-key
  verified: probed
transport: streamable-http
stateless: true
authentication:
  scheme: http bearer
  header: 'Authorization: Bearer mk_...'
  note: >
    No OAuth. The provider documents this as a deliberate choice on
    https://macadress.com/mcp: "MCP's authorization spec is optional for HTTP transports,
    not required... Pasting an existing API key works today in every MCP client we're
    aware of." Neither /.well-known/oauth-authorization-server nor
    /.well-known/oauth-protected-resource is served on mcp.macadress.com (both 404).
client_config_example: |
  {
    "mcpServers": {
      "macadress": {
        "url": "https://mcp.macadress.com/mcp",
        "headers": { "Authorization": "Bearer mk_your_api_key" }
      }
    }
  }

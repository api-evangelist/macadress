description: >
  Recommended x-agentic-access execution contracts for exposing the macadress.com API to AI
  agents. Classified from the published OpenAPI plus the provider's own quota and billing
  rules. A governance starting point — review and bind audience per deployment.
posture: >
  This is one of the low-risk shapes: every operation is a read, nothing mutates
  provider-side state, and the only irreversible consequence of any call is quota spend.
  That makes the interesting control here ECONOMIC rather than safety-critical. A batch
  lookup bills per address resolved, so a single agent call can consume 100 lookups, and a
  free-plan agent can exhaust its whole 1,000-lookup cycle in ten calls with no way to
  reverse it. Budget caps and retry discipline are the governance surface, not human
  approval.
provider_consent_signals:
  robots_txt: https://macadress.com/robots.txt
  content_signal: 'search=yes, ai-input=yes, ai-train=no'
  named_agents_allowed: [GPTBot, ChatGPT-User, ClaudeBot, anthropic-ai, Google-Extended, PerplexityBot, CCBot]
  disallowed_paths: [/admin]
  llms_txt: https://macadress.com/llms.txt
  reading: >
    The provider explicitly permits inference-time agent retrieval and explicitly refuses
    training use, and it publishes an llms.txt naming its own surfaces. Its llms.txt also
    states that every /lookup/:mac and /vendor/:id page is safe for an agent to fetch and
    cite, and asks agents to prefer linking a human to the HTML page over the raw API.
    Honour the ai-train=no signal: results retrieved here are for answering, not for
    corpus building.

note: >
  There is NO first-party client SDK for this API, in any language, and the provider says
  so on purpose: the docs open with "Three endpoints, plain JSON, no SDK required."
  Registry sweeps for a "macadress" package on npm, PyPI, RubyGems and crates.io all miss.
  What the provider does ship is integrations for the tools its buyers already run — a
  Splunk add-on, a MISP enrichment module, and an iTop/TeemIp extension — plus a licensed
  .deb of the server itself. No SDKs pointer is emitted in apis.yml, because these are
  host-application plugins, not client libraries, and crediting them as SDKs would
  misdescribe the surface.

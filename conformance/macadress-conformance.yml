note: >
  Cross-cutting web-API standards are mostly NOT claimed here, and the honest reading is
  that this is a small key-auth read API that never needed them. What it does have is a
  strong DOMAIN-standard signature: the contract itself speaks IEEE registry vocabulary
  (MA-L/MA-M/MA-S/IAB/CID), IEEE 802c SLAP quadrants, RFC 4291 EUI-64/link-local
  derivation and ISO 3166-1 alpha-2 country codes as typed enums rather than free text,
  and the provider republishes the dataset in the de-facto interchange formats of the
  tools in its market (Wireshark manuf, nmap-mac-prefixes, Cisco vendorMacs.xml).
cross_cutting:
- id: oauth2
  conforms: false
  evidence: >
    No oauth2 securityScheme in the OpenAPI; both schemes are key-based (http bearer,
    apiKey in query). /.well-known/oauth-authorization-server 404s on all three hosts. The
    provider states on https://macadress.com/mcp that it deliberately did not implement
    MCP's optional OAuth 2.1 authorization server.
- id: oidc

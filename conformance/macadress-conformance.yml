domain_standards:
- id: ieee-oui-registry
  name: IEEE MA-L / MA-M / MA-S / IAB / CID registration blocks
  conforms: true
  evidence:
    spec_location: components.schemas.VendorBlock.properties.block_type and components.schemas.Result.properties.block_type
    detail: >
      block_type is a closed enum [MA-L, MA-M, MA-S, IAB, CID] — the IEEE Registration
      Authority's own assignment classes — and mask_bits is a closed enum [24, 28, 36]
      matching those classes' prefix widths. prefix_length in the lookup Result carries the
      same three widths. The API models the registry's structure, not a flattened
      "first three octets" approximation, which is what separates it from a bare OUI lookup.
    docs: https://macadress.com/data-sources
- id: ieee-802c-slap
  name: IEEE 802c Structured Local Address Plan
  conforms: true
  evidence:
    spec_location: components.schemas.Result.properties.slap_quadrant
    detail: 'Closed enum [AAI, ELI, reserved, SAI, null] — the four 802c SLAP quadrants — populated only for locally administered addresses.'
    docs: https://macadress.com/docs
- id: ieee-802-addressing-bits
  name: IEEE 802 I/G and U/L address bits
  conforms: true
  evidence:
    spec_location: components.schemas.Result.properties.transmission_type and .administration_type
    detail: >
      transmission_type is a closed enum [unicast, multicast, broadcast] read from the I/G
      bit; administration_type is [universally_administered, locally_administered] read
      from the U/L bit. Both are typed, not prose.
- id: rfc4291-eui64
  name: RFC 4291 modified EUI-64 / IPv6 link-local derivation
  conforms: true
  evidence:
    spec_location: components.schemas.Result.properties.eui64 and .ipv6_link_local
    detail: >
      The contract returns the modified EUI-64 and the SLAAC-derived fe80:: link-local
      address for unicast inputs, and documents both as mathematical derivations from the
      input rather than confirmation the device uses them.
    docs: https://macadress.com/docs
- id: iso-3166-1-alpha-2
  name: ISO 3166-1 alpha-2 country codes
  conforms: true
  evidence:
    spec_location: components.schemas.Result.properties.country, .vendor_location.country_code, and the searchVendors `country` query parameter
    detail: 'Country is typed as an exact ISO 3166-1 alpha-2 code on both input (filter) and output, e.g. US, DE, JP.'
- id: tool-interchange-formats
  name: Wireshark manuf, nmap-mac-prefixes, Cisco vendorMacs.xml
  conforms: true
  evidence:
    location: https://macadress.com/downloads
    detail: >
      The vendor database is republished as drop-in replacements for Wireshark's manuf file
      and nmap's nmap-mac-prefixes file, plus Cisco's vendorMacs.xml schema, alongside CSV
      and JSON. These are the de-facto interchange formats of this market's tooling: a
      consumer who already speaks them integrates with no bespoke connector. Rebuilt from
      the live registry twice daily.
    docs: https://macadress.com/learn

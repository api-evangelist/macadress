  licence is a "contact us" motion, and even that names a starting price. Quota is a
  rolling 30-day cycle from signup, NOT a calendar month (stated on /docs). A batch call
  bills per address actually resolved, not per HTTP request; a vendor search bills as one
  lookup. Free stops hard at quota; paid tiers get a 20% grace buffer, and grace consumed
  is carried into the next cycle as a smaller starting budget rather than billed.

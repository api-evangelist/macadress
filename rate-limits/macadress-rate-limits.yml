enforced: true
note: >
  Two independent budgets are enforced on every plan: a requests-per-minute cap on a
  rolling window (not a fixed clock minute), and a lookup quota over a rolling 30-day
  cycle that starts at signup. The RPM budget is shared across both lookup endpoints and
  a batch request counts once against it; the cycle quota counts per address actually
  resolved. GET /v1/healthz is exempt from both and needs no key. The MCP server enforces
  the same per-plan numbers, but each surface converges its usage count independently
  rather than sharing one live counter (provider's own wording). Usage counters are held
  in API memory and flushed to storage about once a minute, so the account page can lag
  live usage by that much.
